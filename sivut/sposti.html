<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sähköposti - Tolviander</title>

    <!-- Omat tyylit -->
    <link rel="stylesheet" href="tyylit.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body class="body">
    <div id="container" class="container my-4 text-center" style="color: whitesmoke;">

        <!-- Otsikko -->
        <h1 id="etuosivunotsikko" class="etusivunotsikko mb-4">
            <span class="otsikon_rajaviiva">TOLVIANDER</span>
        </h1>

        <!-- Navigaatiopalkki -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5 rounded">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html" style="color:#C5A059">Tarinamme</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../sivut/materiaali.html" style="color:#C5A059">Materiaali</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../sivut/filosofia.html" style="color:#C5A059">Filosofiamme</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" style="color:#C5A059">Galleria</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../sivut/yhteys.html" style="color:#C5A059">Ota yhteyttä</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Lomake-osio -->
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <h2 class="h3 mb-4" style="color:#C5A059;">LÄHETÄ MEILLE VIESTI</h2>
                
                <form action="#" method="post" class="text-start">
                    
                    <!-- Nimi -->
                    <div class="mb-3">
                        <label for="nimi" class="form-label">Nimi</label>
                        <input type="text" class="form-control" id="nimi" placeholder="Etunimi Sukunimi" required>
                    </div>

                    <!-- Puhelin -->
                    <div class="mb-3">
                        <label for="puhelin" class="form-label">Puhelinnumero</label>
                        <input type="tel" class="form-control" id="puhelin" placeholder="040 123 4567">
                    </div>

                    <!-- Sähköposti -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Sähköposti</label>
                        <input type="email" class="form-control" id="email" placeholder="nimi@esimerkki.fi" required>
                    </div>

                    <!-- Viestikenttä -->
                    <div class="mb-4">
                        <label for="viesti" class="form-label">Viesti / Toiveet</label>
                        <textarea class="form-control" id="viesti" rows="6" placeholder="Kirjoita viestisi tai toiveesi tähän..." required></textarea>
                    </div>

                    <!-- Lähetä-painike -->
                    <div class="text-center">
                        <button type="submit" class="btn px-5 py-2 fw-bold" style="background-color: #C5A059; color: #121212;">
                            Lähetä
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </div>
</body>

</html>
